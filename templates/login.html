{% extends "base.html" %}
{% block title %}Admin Login - FLAREN{% endblock %}
{% block content %}
<section class="page-header">
  <h1>Private Owner Access</h1>
  <p>Enter the admin password to open the dashboard.</p>
</section>

<form class="order-form fade-in" method="POST">
  <label>Username</label>
  <input type="text" name="username" required>

  <label>Password</label>
  <input type="password" name="password" required>

  <button type="submit" class="btn btn-primary">Open Dashboard</button>
</form>
{% endblock %}
